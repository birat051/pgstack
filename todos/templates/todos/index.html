<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Todos — pgstack</title>
</head>
<body>
    <h1>Todos</h1>
    <nav>
        <a href="{% url 'search' %}">Search</a>
        ·
        {% if request.user.is_authenticated %}
            <a href="{% url 'settings' %}">Settings</a>
            ·
            <form method="post" action="{% url 'logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit">Log out</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Log in</a>
        {% endif %}
    </nav>

    {% if todos %}
        <ul>
            {% for todo in todos %}
                <li>{{ todo.title }} — <span>{{ todo.get_status_display }}</span></li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No todos yet.</p>
    {% endif %}
</body>
</html>
