<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Dashboard — pgstack</title>
</head>
<body>
    <nav>
        <a href="{% url 'index' %}">Todos</a>
        ·
        <a href="{% url 'search' %}">Search</a>
        {% if view_username %}· <span>List: @{{ view_username }}</span>{% endif %}
        ·
        <a href="{% url 'queue_monitor' %}">Queue</a>
    </nav>
    <h1>Todo counts by status</h1>
    <section>
        <article>
            <h2>Pending</h2>
            <p>{{ counts.pending }}</p>
        </article>
        <article>
            <h2>Done</h2>
            <p>{{ counts.done }}</p>
        </article>
        <article>
            <h2>Overdue</h2>
            <p>{{ counts.overdue }}</p>
        </article>
    </section>
</body>
</html>
