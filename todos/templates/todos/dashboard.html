{% extends "todos/base.html" %}

{% block title %}Dashboard — pgstack{% endblock %}

{% block content %}
    {% if view_username %}<p>List: @{{ view_username }}</p>{% endif %}
    <h1>Todo counts by status</h1>
    <section>
        <article>
            <h2>Pending</h2>
            <p>{{ counts.pending }}</p>
        </article>
        <article>
            <h2>Done</h2>
            <p>{{ counts.done }}</p>
        </article>
        <article>
            <h2>Overdue</h2>
            <p>{{ counts.overdue }}</p>
        </article>
    </section>
{% endblock %}
