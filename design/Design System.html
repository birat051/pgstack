<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pgstack — Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { font-family: "Geist", ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  :root {
    --bg:       #f3efe6;
    --bg-2:     #ebe6da;
    --paper:    #faf7f0;
    --ink:      #14181d;
    --ink-2:    #2a2f37;
    --muted:    #6b6f78;
    --rule:     #d9d3c4;
    --rule-2:   #c8c1ae;
    --pg:       #2f6fb5;
    --pg-deep:  #1f4d80;
    --pg-soft:  #e6eef8;
    --amber:    #b97d2a;
    --green:    #3d7a4a;
    --red:      #b14b3c;
    --sans:     "Geist", ui-sans-serif, system-ui, sans-serif;
    --mono:     "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --serif:    "Instrument Serif", Georgia, serif;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">

/* ─────────────────────────────────────────────
   SHARED MICRO-COMPONENTS
   ───────────────────────────────────────────── */
const DSep = ({ label }) => (
  <div style={{
    display: "flex", alignItems: "center", gap: 10,
    margin: "18px 0 12px",
    fontFamily: "var(--mono)", fontSize: 10.5,
    letterSpacing: "0.13em", textTransform: "uppercase", color: "var(--muted)"
  }}>
    <span>{label}</span>
    <div style={{ flex: 1, height: 1, background: "var(--rule)" }} />
  </div>
);

const Swatch = ({ color, label, token, hex }) => (
  <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
    <div style={{
      width: 60, height: 44, borderRadius: 9, background: color,
      border: "1px solid rgba(20,24,29,0.09)",
      boxShadow: "0 1px 3px rgba(20,24,29,0.07)"
    }} />
    <div style={{ fontFamily: "var(--mono)", fontSize: 11, color: "var(--ink)", fontWeight: 500 }}>{label}</div>
    <div style={{ fontFamily: "var(--mono)", fontSize: 9.5, color: "var(--muted)", lineHeight: 1.5 }}>
      <div>{token}</div>
      <div>{hex}</div>
    </div>
  </div>
);

/* ─────────────────────────────────────────────
   1. COLOR TOKENS
   ───────────────────────────────────────────── */
const ArtColors = () => (
  <div style={{ padding: 24, background: "var(--paper)", fontFamily: "var(--sans)" }}>
    <DSep label="Neutral / Surface" />
    <div style={{ display: "flex", flexWrap: "wrap", gap: 14 }}>
      <Swatch color="var(--paper)"  label="Paper"   token="--paper"  hex="#faf7f0" />
      <Swatch color="var(--bg)"     label="BG"       token="--bg"     hex="#f3efe6" />
      <Swatch color="var(--bg-2)"   label="BG 2"     token="--bg-2"   hex="#ebe6da" />
      <Swatch color="var(--rule)"   label="Rule"     token="--rule"   hex="#d9d3c4" />
      <Swatch color="var(--rule-2)" label="Rule 2"   token="--rule-2" hex="#c8c1ae" />
      <Swatch color="var(--muted)"  label="Muted"    token="--muted"  hex="#6b6f78" />
      <Swatch color="var(--ink-2)"  label="Ink 2"    token="--ink-2"  hex="#2a2f37" />
      <Swatch color="var(--ink)"    label="Ink"      token="--ink"    hex="#14181d" />
    </div>

    <DSep label="Accent — Postgres Blue" />
    <div style={{ display: "flex", flexWrap: "wrap", gap: 14 }}>
      <Swatch color="var(--pg-soft)" label="PG Soft"  token="--pg-soft"  hex="#e6eef8" />
      <Swatch color="var(--pg)"      label="PG"        token="--pg"       hex="#2f6fb5" />
      <Swatch color="var(--pg-deep)" label="PG Deep"   token="--pg-deep"  hex="#1f4d80" />
    </div>

    <DSep label="Semantic — Status" />
    <div style={{ display: "flex", flexWrap: "wrap", gap: 14 }}>
      <Swatch color="#edf7f0"        label="Green Soft" token="—"         hex="#edf7f0" />
      <Swatch color="var(--green)"   label="Green"      token="--green"   hex="#3d7a4a" />
      <Swatch color="#fdf4e4"        label="Amber Soft" token="—"         hex="#fdf4e4" />
      <Swatch color="var(--amber)"   label="Amber"      token="--amber"   hex="#b97d2a" />
      <Swatch color="#fdf0ee"        label="Red Soft"   token="—"         hex="#fdf0ee" />
      <Swatch color="var(--red)"     label="Red"        token="--red"     hex="#b14b3c" />
    </div>

    <DSep label="Note" />
    <div style={{ fontFamily: "var(--mono)", fontSize: 11, color: "var(--muted)", lineHeight: 1.6 }}>
      All tokens defined in <span style={{ color: "var(--ink)" }}>base.css :root</span>. Dark mode overrides applied under <span style={{ color: "var(--ink)" }}>[data-theme="dark"]</span> or <span style={{ color: "var(--ink)" }}>@media (prefers-color-scheme: dark)</span>.
    </div>
  </div>
);

/* ─────────────────────────────────────────────
   2. DARK MODE TOKENS
   ───────────────────────────────────────────── */
const ArtDark = () => (
  <div style={{ padding: 24, background: "#0f1216", fontFamily: "var(--sans)", borderRadius: 0 }}>
    <div style={{ fontFamily: "var(--mono)", fontSize: 10.5, letterSpacing: "0.12em", textTransform: "uppercase", color: "#6b7280", marginBottom: 14 }}>
      Dark mode overrides · [data-theme="dark"]
    </div>
    {[
      ["--bg",       "#0f1216",               "Page background"],
      ["--bg-2",     "#14181d",               "Elevated surface"],
      ["--paper",    "#1c2128",               "Card / input surface"],
      ["--ink",      "#e7e3d7",               "Primary text"],
      ["--ink-2",    "#cfd3dc",               "Secondary text"],
      ["--muted",    "#8a8f99",               "Tertiary / placeholder"],
      ["--rule",     "#1c2128",               "Borders"],
      ["--rule-2",   "#2a2f37",               "Subtle borders"],
      ["--pg",       "#6aaef0",               "Accent blue (lightened)"],
      ["--pg-soft",  "rgba(106,174,240,.14)", "Accent surface"],
      ["--pg-deep",  "#9ec1ed",               "Deep accent text"],
    ].map(([token, hex, desc]) => (
      <div key={token} style={{
        display: "grid", gridTemplateColumns: "130px 110px 1fr",
        alignItems: "center", gap: 10,
        padding: "8px 0", borderBottom: "1px solid #1c2128",
        fontFamily: "var(--mono)", fontSize: 11.5,
      }}>
        <span style={{ color: "#9ec1ed" }}>{token}</span>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <div style={{ width: 14, height: 14, borderRadius: 3, background: hex, border: "1px solid rgba(255,255,255,0.1)", flexShrink: 0 }} />
          <span style={{ color: "#c7a96b", fontSize: 10.5 }}>{hex}</span>
        </div>
        <span style={{ color: "#6b7280", fontSize: 11 }}>{desc}</span>
      </div>
    ))}
  </div>
);

/* ─────────────────────────────────────────────
   3. TYPOGRAPHY
   ───────────────────────────────────────────── */
const ArtType = () => (
  <div style={{ padding: 24, background: "var(--paper)", fontFamily: "var(--sans)" }}>
    {[
      { label: "Display",  size: "58px",   weight: 600, lh: "0.98", ls: "-0.035em", sample: "One database." },
      { label: "H1",       size: "42px",   weight: 600, lh: "1.02", ls: "-0.03em",  sample: "Search, Queue, Live" },
      { label: "H2",       size: "30px",   weight: 600, lh: "1.08", ls: "-0.025em", sample: "Full-text search" },
      { label: "H3",       size: "22px",   weight: 600, lh: "1.12", ls: "-0.02em",  sample: "Replace Elasticsearch" },
      { label: "H4",       size: "18px",   weight: 600, lh: "1.2",  ls: "-0.015em", sample: "GIN index · ts_rank scoring" },
      { label: "Body lg",  size: "16.5px", weight: 400, lh: "1.55", ls: "0",        sample: "Results ranked by relevance with ts_headline snippets." },
      { label: "Body",     size: "14.5px", weight: 400, lh: "1.55", ls: "0",        sample: "The worker pulls jobs using SELECT … FOR UPDATE SKIP LOCKED." },
      { label: "Body sm",  size: "13px",   weight: 400, lh: "1.5",  ls: "0",        sample: "Sessions persisted via django.contrib.auth · Postgres 16" },
      { label: "Label",    size: "11.5px", weight: 400, lh: "1",    ls: "0.1em",    sample: "PHASE 2 · STATUS · QUEUED", mono: true },
      { label: "Code",     size: "12.5px", weight: 400, lh: "1.6",  ls: "0",        sample: "SELECT id FROM todos_job WHERE status = 'queued'", mono: true, dark: true },
    ].map(({ label, size, weight, lh, ls, sample, mono, dark }) => (
      <div key={label} style={{
        display: "grid", gridTemplateColumns: "70px 1fr 150px",
        alignItems: "baseline", gap: 14,
        padding: "9px 0", borderBottom: "1px solid var(--rule)",
      }}>
        <div style={{ fontFamily: "var(--mono)", fontSize: 10, color: "var(--muted)", letterSpacing: "0.08em", textTransform: "uppercase", alignSelf: "center" }}>{label}</div>
        <div style={{
          fontFamily: mono ? "var(--mono)" : "var(--sans)",
          fontSize: size, fontWeight: weight, lineHeight: lh, letterSpacing: ls,
          color: dark ? "#c7a96b" : "var(--ink)",
          background: dark ? "#0f1216" : "transparent",
          padding: dark ? "4px 10px" : 0,
          borderRadius: dark ? 6 : 0,
          overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
        }}>{sample}</div>
        <div style={{ fontFamily: "var(--mono)", fontSize: 9.5, color: "var(--muted)", alignSelf: "center", lineHeight: 1.6, textAlign: "right" }}>
          <div>{size} · {weight}</div>
          <div>lh {lh}</div>
          {ls !== "0" && <div>ls {ls}</div>}
        </div>
      </div>
    ))}

    <div style={{ marginTop: 14, padding: "11px 14px", background: "#0f1216", borderRadius: 10, fontFamily: "var(--mono)", fontSize: 12, lineHeight: 1.6, color: "#8a8f99" }}>
      <span style={{ color: "#9ec1ed" }}>--sans</span>: Geist &nbsp;·&nbsp;
      <span style={{ color: "#9ec1ed" }}>--mono</span>: Geist Mono &nbsp;·&nbsp;
      <span style={{ color: "#9ec1ed", fontFamily: "var(--serif)", fontStyle: "italic" }}>--serif</span>
      <span style={{ color: "#c7a96b", fontFamily: "var(--serif)", fontStyle: "italic" }}> Instrument Serif italic — editorial only</span>
    </div>
  </div>
);

/* ─────────────────────────────────────────────
   4. SPACING + RADIUS + SHADOW
   ───────────────────────────────────────────── */
const ArtSpacing = () => (
  <div style={{ padding: 24, background: "var(--paper)", fontFamily: "var(--sans)" }}>
    <DSep label="Spacing scale (4px base)" />
    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
      {[4, 8, 12, 16, 20, 24, 32, 40, 48, 64, 80].map(n => (
        <div key={n} style={{ display: "flex", alignItems: "center", gap: 14 }}>
          <div style={{ fontFamily: "var(--mono)", fontSize: 10.5, color: "var(--muted)", width: 26, textAlign: "right" }}>{n}</div>
          <div style={{ width: n, height: 12, borderRadius: 3, background: "var(--pg)", opacity: 0.65, flexShrink: 0 }} />
          <div style={{ fontFamily: "var(--mono)", fontSize: 10, color: "var(--muted)" }}>{n / 4}rem</div>
        </div>
      ))}
    </div>

    <DSep label="Border radius" />
    <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginTop: 4 }}>
      {[{ r: 4, l: "xs" }, { r: 6, l: "sm" }, { r: 8, l: "base" }, { r: 10, l: "md" }, { r: 12, l: "lg" }, { r: 16, l: "xl" }, { r: 999, l: "pill" }].map(({ r, l }) => (
        <div key={r} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 7 }}>
          <div style={{ width: 38, height: 38, borderRadius: r, background: "var(--bg-2)", border: "1px solid var(--rule-2)" }} />
          <div style={{ fontFamily: "var(--mono)", fontSize: 9.5, color: "var(--muted)", textAlign: "center", lineHeight: 1.4 }}>{l}<br />{r === 999 ? "999" : r + "px"}</div>
        </div>
      ))}
    </div>

    <DSep label="Shadows" />
    {[
      { label: "sm",    v: "0 1px 2px rgba(20,24,29,0.08)" },
      { label: "md",    v: "0 4px 12px rgba(20,24,29,0.12)" },
      { label: "lg",    v: "0 16px 40px rgba(20,24,29,0.20)" },
      { label: "card",  v: "0 1px 0 rgba(20,24,29,0.02), 0 24px 60px -40px rgba(20,24,29,0.18)" },
      { label: "focus", v: "0 0 0 3px rgba(47,111,181,0.18)" },
    ].map(({ label, v }) => (
      <div key={label} style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 10 }}>
        <div style={{ width: 44, height: 30, borderRadius: 8, background: "var(--paper)", boxShadow: v, border: "1px solid var(--rule)", flexShrink: 0 }} />
        <div>
          <div style={{ fontFamily: "var(--mono)", fontSize: 11, color: "var(--ink)", marginBottom: 2 }}>shadow-{label}</div>
          <div style={{ fontFamily: "var(--mono)", fontSize: 9.5, color: "var(--muted)", maxWidth: 300, lineHeight: 1.5 }}>{v}</div>
        </div>
      </div>
    ))}
  </div>
);

/* ─────────────────────────────────────────────
   5. BUTTONS
   ───────────────────────────────────────────── */
const ArtButtons = () => (
  <div style={{ padding: 24, background: "var(--paper)", fontFamily: "var(--sans)" }}>
    <DSep label="Primary" />
    <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
      <button style={{ display: "inline-flex", alignItems: "center", height: 42, padding: "0 18px", border: "none", borderRadius: 9, background: "var(--ink)", color: "var(--paper)", fontFamily: "var(--mono)", fontSize: 13, fontWeight: 500, cursor: "pointer", boxShadow: "0 1px 0 rgba(255,255,255,0.06) inset, 0 4px 12px rgba(20,24,29,0.3)", letterSpacing: "0.01em" }}>Save todo</button>
      <button style={{ display: "inline-flex", alignItems: "center", height: 34, padding: "0 14px", border: "none", borderRadius: 7, background: "var(--ink)", color: "var(--paper)", fontFamily: "var(--mono)", fontSize: 12, cursor: "pointer", boxShadow: "0 1px 0 rgba(255,255,255,0.06) inset, 0 3px 8px rgba(20,24,29,0.25)" }}>sm</button>
      <span style={{ fontFamily: "var(--mono)", fontSize: 10, color: "var(--muted)", marginLeft: 4 }}>:hover → bg #0c1014 &nbsp; :active → translateY(1px)</span>
    </div>

    <DSep label="Secondary" />
    <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
      <button style={{ display: "inline-flex", alignItems: "center", height: 42, padding: "0 18px", border: "1px solid var(--rule-2)", borderRadius: 9, background: "var(--paper)", color: "var(--ink)", fontFamily: "var(--mono)", fontSize: 13, cursor: "pointer", boxShadow: "0 1px 2px rgba(20,24,29,0.06)" }}>Cancel</button>
      <button style={{ display: "inline-flex", alignItems: "center", height: 42, padding: "0 18px", border: "1px solid var(--pg)", borderRadius: 9, background: "var(--pg-soft)", color: "var(--pg-deep)", fontFamily: "var(--mono)", fontSize: 13, cursor: "pointer" }}>Run query</button>
    </div>

    <DSep label="Ghost" />
    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
      <button style={{ display: "inline-flex", alignItems: "center", height: 42, padding: "0 18px", border: "none", borderRadius: 9, background: "transparent", color: "var(--ink-2)", fontFamily: "var(--mono)", fontSize: 13, cursor: "pointer" }}>Discard</button>
      <span style={{ fontFamily: "var(--mono)", fontSize: 10, color: "var(--muted)" }}>:hover → bg rgba(20,24,29,0.05)</span>
    </div>

    <DSep label="Destructive" />
    <button style={{ display: "inline-flex", alignItems: "center", height: 42, padding: "0 18px", border: "1px solid rgba(177,75,60,0.3)", borderRadius: 9, background: "#fdf0ee", color: "var(--red)", fontFamily: "var(--mono)", fontSize: 13, cursor: "pointer" }}>Delete todo</button>

    <DSep label="Disabled" />
    <button disabled style={{ display: "inline-flex", alignItems: "center", height: 42, padding: "0 18px", border: "1px solid var(--rule)", borderRadius: 9, background: "var(--bg-2)", color: "var(--muted)", fontFamily: "var(--mono)", fontSize: 13, cursor: "not-allowed", opacity: 0.65 }}>Submit</button>

    <DSep label="Log out — Django POST form (not a link)" />
    <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
      <button style={{ display: "inline-flex", alignItems: "center", height: 32, padding: "0 13px", border: "1px solid var(--rule-2)", borderRadius: 7, background: "var(--paper)", color: "var(--ink-2)", fontFamily: "var(--mono)", fontSize: 12, cursor: "pointer", boxShadow: "0 1px 2px rgba(20,24,29,0.04)" }}>Log out</button>
      <span style={{ fontFamily: "var(--mono)", fontSize: 10.5, color: "var(--muted)" }}>method=POST · action=/accounts/logout/</span>
    </div>

    <DSep label="Icon buttons" />
    <div style={{ display: "flex", gap: 8 }}>
      {["⊕ Add", "↺ Retry", "✕ Remove", "↗ View"].map(lbl => (
        <button key={lbl} style={{ display: "inline-flex", alignItems: "center", gap: 6, height: 34, padding: "0 12px", border: "1px solid var(--rule-2)", borderRadius: 7, background: "var(--paper)", color: "var(--ink-2)", fontFamily: "var(--mono)", fontSize: 12, cursor: "pointer" }}>{lbl}</button>
      ))}
    </div>
  </div>
);

/* ─────────────────────────────────────────────
   6. FORM INPUTS
   ───────────────────────────────────────────── */
const ArtInputs = () => (
  <div style={{ padding: 24, background: "var(--paper)", fontFamily: "var(--sans)" }}>
    <DSep label="Text input — default" />
    <label style={{ display: "flex", flexDirection: "column", gap: 7 }}>
      <span style={{ fontFamily: "var(--mono)", fontSize: 11, letterSpacing: "0.1em", textTransform: "uppercase", color: "var(--muted)" }}>Title</span>
      <div style={{ display: "flex", alignItems: "center", height: 42, padding: "0 12px", border: "1px solid var(--rule-2)", borderRadius: 9, background: "#fff" }}>
        <input readOnly placeholder="Buy groceries" style={{ flex: 1, border: "none", outline: "none", background: "transparent", fontFamily: "var(--sans)", fontSize: 14.5, color: "var(--muted)" }} />
      </div>
    </label>

    <DSep label="Text input — focused" />
    <label style={{ display: "flex", flexDirection: "column", gap: 7 }}>
      <span style={{ fontFamily: "var(--mono)", fontSize: 11, letterSpacing: "0.1em", textTransform: "uppercase", color: "var(--muted)" }}>Title</span>
      <div style={{ display: "flex", alignItems: "center", height: 42, padding: "0 12px", border: "1px solid var(--pg)", borderRadius: 9, background: "#fff", boxShadow: "0 0 0 3px rgba(47,111,181,0.16)" }}>
        <input readOnly defaultValue="Write unit tests" style={{ flex: 1, border: "none", outline: "none", background: "transparent", fontFamily: "var(--sans)", fontSize: 14.5, color: "var(--ink)" }} />
      </div>
    </label>

    <DSep label="Text input — error" />
    <label style={{ display: "flex", flexDirection: "column", gap: 7 }}>
      <span style={{ fontFamily: "var(--mono)", fontSize: 11, letterSpacing: "0.1em", textTransform: "uppercase", color: "var(--muted)" }}>Title</span>
      <div style={{ display: "flex", alignItems: "center", height: 42, padding: "0 12px", border: "1px solid var(--red)", borderRadius: 9, background: "#fff", boxShadow: "0 0 0 3px rgba(177,75,60,0.12)" }}>
        <input readOnly defaultValue="" style={{ flex: 1, border: "none", outline: "none", background: "transparent", fontFamily: "var(--sans)", fontSize: 14.5 }} />
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 7, fontFamily: "var(--mono)", fontSize: 11.5, color: "var(--red)" }}>
        <span>⚠</span> This field is required.
      </div>
    </label>

    <DSep label="Search input" />
    <div style={{ display: "flex", alignItems: "center", gap: 10, height: 42, padding: "0 12px", border: "1px solid var(--rule-2)", borderRadius: 9, background: "#fff" }}>
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="var(--muted)" strokeWidth="1.8">
        <circle cx="7" cy="7" r="5" /><line x1="11" y1="11" x2="15" y2="15" />
      </svg>
      <input readOnly placeholder="Search todos…" style={{ flex: 1, border: "none", outline: "none", background: "transparent", fontFamily: "var(--sans)", fontSize: 14.5, color: "var(--muted)" }} />
      <span style={{ fontFamily: "var(--mono)", fontSize: 11, color: "var(--muted)", border: "1px solid var(--rule)", borderRadius: 5, padding: "2px 6px" }}>⌘K</span>
    </div>

    <DSep label="Checkbox" />
    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
      {[
        { checked: false, label: "Pending todo" },
        { checked: true,  label: "Completed todo" },
        { checked: false, label: "Overdue — due yesterday", muted: true },
      ].map(({ checked, label, muted }) => (
        <label key={label} style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}>
