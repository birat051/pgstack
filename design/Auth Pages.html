<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pgstack — Auth Pages</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { font-family: "Geist", ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  :root {
    --bg:       #f3efe6;
    --bg-2:     #ebe6da;
    --paper:    #faf7f0;
    --ink:      #14181d;
    --ink-2:    #2a2f37;
    --muted:    #6b6f78;
    --rule:     #d9d3c4;
    --rule-2:   #c8c1ae;
    --pg:       #2f6fb5;
    --pg-deep:  #1f4d80;
    --pg-soft:  #e6eef8;
    --amber:    #b97d2a;
    --green:    #3d7a4a;
    --red:      #b14b3c;
    --sans:     "Geist", ui-sans-serif, system-ui, sans-serif;
    --mono:     "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @keyframes blink { to { visibility: hidden; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

/* ─────────────────────────────────────────────
   GLOBAL NAV — logged-out state
   ───────────────────────────────────────────── */
const NavLoggedOut = ({ mobile = false }) => (
  <div style={{
    width: "100%",
    background: "var(--paper)",
    borderBottom: "1px solid var(--rule)",
    boxShadow: "0 1px 0 rgba(20,24,29,0.02), 0 2px 8px rgba(20,24,29,0.05)",
    flexShrink: 0,
  }}>
    <div style={{
      display: "flex", alignItems: "center",
      height: mobile ? 50 : 56,
      padding: mobile ? "0 18px" : "0 28px",
      gap: 0,
    }}>
      {/* Wordmark */}
      <a href="#" style={{ display: "flex", alignItems: "center", gap: 9, textDecoration: "none", flexShrink: 0 }}>
        <div style={{
          width: mobile ? 26 : 28, height: mobile ? 26 : 28,
          borderRadius: 7, background: "var(--ink)", color: "var(--paper)",
          display: "grid", placeItems: "center",
          fontFamily: "var(--mono)", fontWeight: 700, fontSize: mobile ? 12 : 13,
        }}>pg</div>
        <span style={{ fontFamily: "var(--mono)", fontWeight: 600, fontSize: mobile ? 13.5 : 14.5, color: "var(--ink)", letterSpacing: "-0.01em" }}>pgstack</span>
        {!mobile && (
          <span style={{ fontFamily: "var(--mono)", fontSize: 10.5, color: "var(--muted)", border: "1px solid var(--rule)", borderRadius: 5, padding: "1px 6px" }}>v0.1</span>
        )}
      </a>

      {/* Nav links — hidden on mobile auth pages */}
      {!mobile && (
        <nav style={{ display: "flex", alignItems: "center", gap: 2, flex: 1, marginLeft: 32 }}>
          {["Todos", "Search", "Users", "Dashboard", "Queue", "Settings"].map(page => (
            <a key={page} href="#" style={{
              display: "inline-flex", alignItems: "center",
              height: 36, padding: "0 12px", borderRadius: 8,
              textDecoration: "none",
              fontFamily: "var(--mono)", fontSize: 12.5,
              color: "var(--muted)",
              border: "1px solid transparent",
            }}>{page}</a>
          ))}
        </nav>
      )}

      {/* Spacer on mobile */}
      {mobile && <div style={{ flex: 1 }} />}

      {/* Auth buttons */}
      <div style={{ display: "flex", alignItems: "center", gap: mobile ? 6 : 8, flexShrink: 0, marginLeft: mobile ? 0 : 0 }}>
        <a href="#" style={{
          display: "inline-flex", alignItems: "center",
          height: mobile ? 30 : 32, padding: `0 ${mobile ? 11 : 13}px`,
          border: "1px solid transparent", borderRadius: 7,
          textDecoration: "none", color: "var(--muted)",
          fontFamily: "var(--mono)", fontSize: mobile ? 11.5 : 12,
        }}>Log in</a>
        <a href="#" style={{
          display: "inline-flex", alignItems: "center",
          height: mobile ? 30 : 32, padding: `0 ${mobile ? 11 : 14}px`,
          border: "none", borderRadius: 7,
          background: "var(--ink)", color: "var(--paper)",
          textDecoration: "none",
          fontFamily: "var(--mono)", fontSize: mobile ? 11.5 : 12,
          boxShadow: "0 1px 0 rgba(255,255,255,0.06) inset, 0 2px 6px rgba(20,24,29,0.22)",
        }}>Register</a>
      </div>
    </div>
  </div>
);

/* ─────────────────────────────────────────────
   SHARED FORM PRIMITIVES
   ───────────────────────────────────────────── */
const FormField = ({ label, type = "text", placeholder, value, error, hint, compact = false, pwToggle = false }) => (
  <label style={{ display: "flex", flexDirection: "column", gap: 6 }}>
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
      <span style={{
        fontFamily: "var(--mono)", fontSize: 11,
        letterSpacing: "0.1em", textTransform: "uppercase",
        color: error ? "var(--red)" : "var(--muted)",
      }}>{label}</span>
      {hint && <span style={{ fontFamily: "var(--mono)", fontSize: 10.5, color: "var(--muted)" }}>{hint}</span>}
    </div>
    <div style={{
      display: "flex", alignItems: "center",
      height: compact ? 40 : 42, padding: "0 12px",
      border: `1px solid ${error ? "var(--red)" : "var(--rule-2)"}`,
      borderRadius: 9, background: "#fff",
      boxShadow: error ? "0 0 0 3px rgba(177,75,60,0.10)" : "none",
    }}>
      <input
        readOnly
        type={type}
        placeholder={placeholder}
        defaultValue={value || ""}
        style={{
          flex: 1, border: "none", outline: "none", background: "transparent",
          fontFamily: "var(--sans)", fontSize: compact ? 14 : 14.5,
          color: value ? "var(--ink)" : "var(--muted)",
        }}
      />
      {pwToggle && (
        <span style={{ fontFamily: "var(--mono)", fontSize: 10.5, color: "var(--muted)", marginLeft: 8, cursor: "pointer", userSelect: "none" }}>SHOW</span>
      )}
    </div>
    {error && (
      <div style={{ display: "flex", alignItems: "center", gap: 7, fontFamily: "var(--mono)", fontSize: 11.5, color: "var(--red)", marginTop: 1 }}>
        <span>⚠</span> {error}
      </div>
    )}
  </label>
);

const NonFieldError = ({ msg }) => (
  <div style={{
    display: "flex", gap: 11, padding: "11px 14px",
    background: "#fdf0ee",
    border: "1px solid rgba(177,75,60,0.28)",
    borderLeft: "3px solid var(--red)",
    borderRadius: 10,
  }}>
    <div style={{
      width: 20, height: 20, borderRadius: "50%",
      background: "var(--red)", color: "#fff",
      display: "grid", placeItems: "center",
      fontSize: 11, fontWeight: 700, flexShrink: 0, marginTop: 1,
      fontFamily: "var(--mono)",
    }}>✕</div>
    <div>
      <div style={{ fontFamily: "var(--mono)", fontSize: 11.5, fontWeight: 600, color: "var(--red)", marginBottom: 3, letterSpacing: "0.02em" }}>Login failed</div>
      <div style={{ fontSize: 13.5, color: "var(--ink-2)", lineHeight: 1.45 }}>{msg}</div>
    </div>
  </div>
);

/* Window-chrome card wrapper */
const FormCard = ({ width, children, url }) => (
  <div style={{
    width, background: "var(--paper)",
    border: "1px solid var(--rule-2)", borderRadius: 16,
    boxShadow: "0 1px 0 rgba(20,24,29,0.02), 0 28px 64px -44px rgba(20,24,29,0.42)",
    overflow: "hidden",
  }}>
    {/* psql window chrome */}
    <div style={{
      display: "flex", alignItems: "center", justifyContent: "space-between",
      padding: "9px 14px",
      background: "linear-gradient(180deg, #ffffff 0%, #f5f0e4 100%)",
      borderBottom: "1px solid var(--rule)",
      fontFamily: "var(--mono)", fontSize: 11.5, color: "var(--muted)",
    }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
        <div style={{ display: "flex", gap: 6 }}>
          {["#d9534f", "#d9a73a", "#5cb85c"].map((c, i) => (
            <div key={i} style={{ width: 10, height: 10, borderRadius: "50%", background: c, opacity: 0.55 }} />
          ))}
        </div>
        <span style={{ letterSpacing: "0.04em" }}>{url}</span>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
        <div style={{ width: 6, height: 6, borderRadius: "50%", background: "var(--green)", boxShadow: "0 0 0 3px rgba(61,122,74,0.18)" }} />
        <span>postgres · connected</span>
      </div>
    </div>
    {children}
  </div>
);

/* ─────────────────────────────────────────────
   PAGE A · LOGIN — DESKTOP CLEAN
   ───────────────────────────────────────────── */
const LoginDesktop = () => (
  <div style={{ width: 1280, background: "var(--bg)", display: "flex", flexDirection: "column" }}>
    <NavLoggedOut />
    {/* Centered content */}
    <div style={{
      flex: 1, display: "flex", flexDirection: "column",
      alignItems: "center", justifyContent: "center",
      padding: "56px 40px 48px",
    }}>
      <FormCard width={420} url="pgstack.local/auth/login/">
        <div style={{ padding: "28px 30px 30px", display: "flex", flexDirection: "column", gap: 20 }}>
          {/* Header */}
          <div>
            <div style={{ fontFamily: "var(--mono)", fontSize: 10.5, letterSpacing: "0.12em", textTransform: "uppercase", color: "var(--muted)", marginBottom: 10 }}>Phase 1 · django.contrib.auth</div>
            <h1 style={{ margin: 0, fontFamily: "var(--sans)", fontWeight: 600, fontSize: 28, letterSpacing: "-0.022em", color: "var(--ink)", lineHeight: 1.08 }}>Log in</h1>
            <p style={{ margin: "7px 0 0", fontSize: 14, color: "var(--muted)", lineHeight: 1.4 }}>Welcome back to pgstack.</p>
          </div>

          {/* Form */}
          <form style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <FormField label="Username" placeholder="ada.lovelace" />
            <FormField label="Password" type="password" placeholder="••••••••••••" pwToggle />

            <button type="button" style={{
              marginTop: 4,
              display: "flex", alignItems: "center", justifyContent: "center", gap: 10,
              height: 46, border: "none", borderRadius: 10,
              background: "var(--ink)", color: "var(--paper)",
              fontFamily: "var(--mono)", fontWeight: 500, fontSize: 13.5,
              cursor: "pointer", letterSpacing: "0.01em",
              boxShadow: "0 1px 0 rgba(255,255,255,0.06) inset, 0 6px 20px -8px rgba(20,24,29,0.55)",
            }}>
              Log in
              <span style={{ fontFamily: "var(--mono)", fontSize: 11, padding: "2px 6px", borderRadius: 5, border: "1px solid rgba(255,255,255,0.18)", color: "rgba(250,247,240,0.6)" }}>⏎</span>
            </button>
          </form>

          {/* Helpers */}
          <div style={{ display: "flex", flexDirection: "column", gap: 8, paddingTop: 4, borderTop: "1px solid var(--rule)" }}>
            <p style={{ margin: 0, fontSize: 13.5, color: "var(--muted)", lineHeight: 1.5 }}>
              New here?{" "}
              <a href="#" style={{ color: "var(--ink)", textDecoration: "none", borderBottom: "1px solid var(--rule-2)" }}>Create an account.</a>
            </p>
            <p style={{ margin: 0, fontSize: 12.5, color: "var(--muted)", lineHeight: 1.5, fontFamily: "var(--mono)" }}>
              New accounts use email as username when logging in.
            </p>
          </div>
        </div>
      </FormCard>

      {/* Bottom annotation */}
      <div style={{ marginTop: 28, fontFamily: "var(--mono)", fontSize: 11, color: "var(--muted)", display: "flex", alignItems: "center", gap: 10 }}>
        <span style={{ background: "var(--pg-soft)", border: "1px solid rgba(47,111,181,0.22)", color: "var(--pg-deep)", borderRadius: 5, padding: "2px 8px" }}>django.contrib.auth.views.LoginView</span>
        <span>·</span>
        <span>POST /auth/login/ · next= redirect</span>
      </div>
    </div>
  </div>
);

/* ─────────────────────────────────────────────
   PAGE A · LOGIN — DESKTOP ERROR STATE
   ───────────────────────────────────────────── */
const LoginDesktopError = () => (
  <div style={{ width: 1280, background: "var(--bg)", display: "flex", flexDirection: "column" }}>
    <NavLoggedOut />
    <div style={{
      flex: 1, display: "flex", flexDirection: "column",
      alignItems: "center", justifyContent: "center",
      padding: "56px 40px 48px",
    }}>
      <FormCard width={420} url="pgstack.local/auth/login/">
        <div style={{ padding: "28px 30px 30px", display: "flex", flexDirection: "column", gap: 18 }}>
          {/* Header */}
          <div>
            <div style={{ fontFamily: "var(--mono)", fontSize: 10.5, letterSpacing: "0.12em", textTransform: "uppercase", color: "var(--muted)", marginBottom: 10 }}>Phase 1 · django.contrib.auth</div>
            <h1 style={{ margin: 0, fontFamily: "var(--sans)", fontWeight: 600, fontSize: 28, letterSpacing: "-0.022em", color: "var(--ink)", lineHeight: 1.08 }}>Log in</h1>
            <p style={{ margin: "7px 0 0", fontSize: 14, color: "var(--muted)", lineHeight: 1.4 }}>Welcome back to pgstack.</p>
          </div>

          {/* Non-field error banner */}
          <NonFieldError msg="Your username and password didn't match. Please check your credentials and try again." />

          {/* Form — fields populated to show error context */}
          <form style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <FormField label="Username" value="ada.lovelace@example.com" />
            <FormField label="Password" type="password" value="wrongpassword" pwToggle />

            <button type="button" style={{
              marginTop: 4,
              display: "flex", alignItems: "center", justifyContent: "center", gap: 10,
              height: 46, border: "none", borderRadius: 10,
              background: "var(--ink)", color: "var(--paper)",
              fontFamily: "var(--mono)", fontWeight: 500, fontSize: 13.5,
              cursor: "pointer", letterSpacing: "0.01em",
              boxShadow: "0 1px 0 rgba(255,255,255,0.06) inset, 0 6px 20px -8px rgba(20,24,29,0.55)",
            }}>
              Log in
              <span style={{ fontFamily: "var(--mono)", fontSize: 11, padding: "2px 6px", borderRadius: 5, border: "1px solid rgba(255,255,255,0.18)", color: "rgba(250,247,240,0.6)" }}>⏎</span>
            </button>
          </form>

          {/* Helpers */}
          <div style={{ display: "flex", flexDirection: "column", gap: 8, paddingTop: 4, borderTop: "1px solid var(--rule)" }}>
            <p style={{ margin: 0, fontSize: 13.5, color: "var(--muted)", lineHeight: 1.5 }}>
              New here?{" "}
              <a href="#" style={{ color: "var(--ink)", textDecoration: "none", borderBottom: "1px solid var(--rule-2)" }}>Create an account.</a>
            </p>
            <p style={{ margin: 0, fontSize: 12.5, color: "var(--muted)", lineHeight: 1.5, fontFamily: "var(--mono)" }}>
              New accounts use email as username when logging in.
            </p>
          </div>
        </div>
      </FormCard>

      {/* Annotation */}
      <div style={{ marginTop: 28, display: "flex", alignItems: "center", gap: 10, fontFamily: "var(--mono)", fontSize: 11, color: "var(--muted)" }}>
        <span style={{ background: "#fdf0ee", border: "1px solid rgba(177,75,60,0.28)", color: "var(--red)", borderRadius: 5, padding: "2px 8px" }}>form.non_field_errors()</span>
        <span>·</span>
        <span>rendered above fields as a banner</span>
      </div>
    </div>
  </div>
);

/* ─────────────────────────────────────────────
   PAGE A · LOGIN — MOBILE
   ───────────────────────────────────────────── */
const LoginMobile = () => (
  <div style={{ width: 390, background: "var(--bg)", display: "flex", flexDirection: "column" }}>
    <NavLoggedOut mobile />
    <div style={{ flex: 1, padding: "32px 20px 28px", display: "flex", flexDirection: "column" }}>
      <FormCard width="100%" url="/auth/login/">
        <div style={{ padding: "22px 22px 26px", display: "flex", flexDirection: "column", gap: 18 }}>
          {/* Header */}
          <div>
            <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.12em", textTransform: "uppercase", color: "var(--muted)", marginBottom: 8 }}>django.contrib.auth</div>
            <h1 style={{ margin: 0, fontFamily: "var(--sans)", fontWeight: 600, fontSize: 24, letterSpacing: "-0.02em", color: "var(--ink)", lineHeight: 1.1 }}>Log in</h1>
            <p style={{ margin: "6px 0 0", fontSize: 13.5, color: "var(--muted)" }}>Welcome back to pgstack.</p>
          </div>

          <form style={{ display: "flex", flexDirection: "column", gap: 13 }}>
            <FormField label="Username" placeholder="ada.lovelace" compact />
            <FormField label="Password" type="password" placeholder="••••••••••••" compact pwToggle />
            <button type="button" style={{
              marginTop: 4,
              display: "flex", alignItems: "center", justifyContent: "center",
              height: 44, border: "none", borderRadius: 10,
              background: "var(--ink)", color: "var(--paper)",
              fontFamily: "var(--mono)", fontWeight: 500, fontSize: 14,
              cursor: "pointer",
              boxShadow: "0 1px 0 rgba(255,255,255,0.06) inset, 0 6px 20px -8px rgba(20,24,29,0.55)",
            }}>Log in</button>
          </form>

          <div style={{ display: "flex", flexDirection: "column", gap: 7, paddingTop: 4, borderTop: "1px solid var(--rule)" }}>
            <p style={{ margin: 0, fontSize: 13, color: "var(--muted)", lineHeight: 1.5 }}>
              New here?{" "}
              <a href="#" style={{ color: "var(--ink)", textDecoration: "none", borderBottom: "1px solid var(--rule-2)" }}>Create an account.</a>
            </p>
            <p style={{ margin: 0, fontSize: 12, color: "var(--muted)", lineHeight: 1.5, fontFamily: "var(--mono)" }}>
              New accounts use email as username when logging in.
            </p>
          </div>
        </div>
      </FormCard>
    </div>
  </div>
);

/* ─────────────────────────────────────────────
   PAGE B · SIGNUP — DESKTOP CLEAN
   ───────────────────────────────────────────── */
const SignupDesktop = () => (
  <div style={{ width: 1280, background: "var(--bg)", display: "flex", flexDirection: "column" }}>
    <NavLoggedOut />
    <div style={{
      flex: 1, display: "flex", flexDirection: "column",
      alignItems: "center", justifyContent: "center",
      padding: "44px 40px 48px",
    }}>
      <FormCard width={440} url="pgstack.local/auth/signup/">
        <div style={{ padding: "28px 30px 30px", display: "flex", flexDirection: "column", gap: 20 }}>
          {/* Header */}
          <div>
            <div style={{ fontFamily: "var(--mono)", fontSize: 10.5, letterSpacing: "0.12em", textTransform: "uppercase", color: "var(--muted)", marginBottom: 10 }}>Phase 1 · django.contrib.auth</div>
            <h1 style={{ margin: 0, fontFamily: "var(--sans)", fontWeight: 600, fontSize: 28, letterSpacing: "-0.022em", color: "var(--ink)", lineHeight: 1.08 }}>Create an account</h1>
            <p style={{ margin: "7px 0 0", fontSize: 14, color: "var(--muted)", lineHeight: 1.4 }}>One account unlocks all four demo flows.</p>
          </div>

          {/* Form */}
          <form style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <FormField label="Full name" placeholder="Ada Lovelace" />
            <FormField label="Email" type="email" placeholder="ada@example.com" hint="used as username" />
            <FormField label="Password" type="password" placeholder="••••••••••••" pwToggle />
            <FormField label="Confirm password" type="password" placeholder="••••••••••••" pwToggle />

            <button type="button" style={{
              marginTop: 4,
              display: "flex", alignItems: "center", justifyContent: "center", gap: 10,
              height: 46, border: "none", borderRadius: 10,
              background: "var(--ink)", color: "var(--paper)",
              fontFamily: "var(--mono)", fontWeight: 500, fontSize: 13.5,
              cursor: "pointer", letterSpacing: "0.01em",
              boxShadow: "0 1px 0 rgba(255,255,255,0.06) inset, 0 6px 20px -8px rgba(20,24,29,0.55)",
            }}>
              Sign up
              <span style={{ fontFamily: "var(--mono)", fontSize: 11, padding: "2px 6px", borderRadius: 5, border: "1px solid rgba(255,255,255,0.18)", color: "rgba(250,247,240,0.6)" }}>⏎</span>
            </button>
          </form>

          {/* Footer link */}
          <div style={{ paddingTop: 4, borderTop: "1px solid var(--rule)" }}>
            <p style={{ margin: 0, fontSize: 13.5, color: "var(--muted)", lineHeight: 1.55 }}>
              Already have an account?{" "}
              <a href="#" style={{ color: "var(--ink)", textDecoration: "none", borderBottom: "1px solid var(--rule-2)" }}>Log in</a>
              {" "}— use your email as your username.
            </p>
          </div>
        </div>
      </FormCard>

      {/* Annotation */}
      <div style={{ marginTop: 28, fontFamily: "var(--mono)", fontSize: 11, color: "var(--muted)", display: "flex", alignItems: "center", gap: 10 }}>
        <span style={{ background: "var(--pg-soft)", border: "1px solid rgba(47,111,181,0.22)", color: "var(--pg-deep)", borderRadius: 5, padding: "2px 8px" }}>UserCreationForm (extended)</span>
        <span>·</span>
        <span>POST /auth/signup/ · auto-login on success</span>
      </div>
    </div>
  </div>
);

/* ─────────────────────────────────────────────
   PAGE B · SIGNUP — DESKTOP WITH ERRORS
   ───────────────────────────────────────────── */
const SignupDesktopErrors = () => (
  <div style={{ width: 1280, background: "var(--bg)", display: "flex", flexDirection: "column" }}>
    <NavLoggedOut />
    <div style={{
      flex: 1, display: "flex", flexDirection: "column",
      alignItems: "center", justifyContent: "center",
      padding: "36px 40px 44px",
    }}>
      <FormCard width={440} url="pgstack.local/auth/signup/">
        <div style={{ padding: "28px 30px 30px", display: "flex", flexDirection: "column", gap: 18 }}>
          {/* Header */}
          <div>
            <div style={{ fontFamily: "var(--mono)", fontSize: 10.5, letterSpacing: "0.12em", textTransform: "uppercase", color: "var(--muted)", marginBottom: 10 }}>Phase 1 · django.contrib.auth</div>
            <h1 style={{ margin: 0, fontFamily: "var(--sans)", fontWeight: 600, fontSize: 28, letterSpacing: "-0.022em", color: "var(--ink)", lineHeight: 1.08 }}>Create an account</h1>
            <p style={{ margin: "7px 0 0", fontSize: 14, color: "var(--muted)", lineHeight: 1.4 }}>One account unlocks all four demo flows.</p>
          </div>

          {/* Non-field error banner (optional — e.g. email already in use) */}
          <NonFieldError msg="An account with this email already exists. Try logging in instead." />

          {/* Form with field-level errors */}
          <form style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <FormField label="Full name" value="Ada Lovelace" />
            <FormField
              label="Email"
              type="email"
              value="ada@example.com"
              error="A user with that email already exists."
              hint="used as username"
            />
            <FormField
              label="Password"
              type="password"
              value="short"
              pwToggle
              error="This password is too short. It must contain at least 8 characters."
            />
            <FormField
              label="Confirm password"
              type="password"
              value="different"
              pwToggle
              error="The two password fields didn't match."
            />

            <button type="button" style={{
              marginTop: 4,
              display: "flex", alignItems: "center", justifyContent: "center", gap: 10,
              height: 46, border: "none", borderRadius: 10,
              background: "var(--ink)", color: "var(--paper)",
              fontFamily: "var(--mono)", fontWeight: 500, fontSize: 13.5,
              cursor: "pointer", letterSpacing: "0.01em",
              boxShadow: "0 1px 0 rgba(255,255,255,0.06) inset, 0 6px 20px -8px rgba(20,24,29,0.55)",
            }}>
              Sign up
              <span style={{ fontFamily: "var(--mono)", fontSize: 11, padding: "2px 6px", borderRadius: 5, border: "1px solid rgba(255,255,255,0.18)", color: "rgba(250,247,240,0.6)" }}>⏎</span>
            </button>
          </form>

          {/* Footer link */}
          <div style={{ paddingTop: 4, borderTop: "1px solid var(--rule)" }}>
            <p style={{ margin: 0, fontSize: 13.5, color: "var(--muted)", lineHeight: 1.55 }}>
              Already have an account?{" "}
              <a href="#" style={{ color: "var(--ink)", textDecoration: "none", borderBottom: "1px solid var(--rule-2)" }}>Log in</a>
              {" "}— use your email as your username.
            </p>
          </div>
        </div>
      </FormCard>

      {/* Annotation */}
      <div style={{ marginTop: 28, display: "flex", flexWrap: "wrap", gap: 8, justifyContent: "center", fontFamily: "var(--mono)", fontSize: 11, color: "var(--muted)" }}>
        <span style={{ background: "#fdf0ee", border: "1px solid rgba(177,75,60,0.28)", color: "var(--red)", borderRadius: 5, padding: "2px 8px" }}>form.errors (field-level)</span>
        <span>+</span>
        <span style={{ background: "#fdf0ee", border: "1px solid rgba(177,75,60,0.28)", color: "var(--red)", borderRadius: 5, padding: "2px 8px" }}>form.non_field_errors() (optional)</span>
        <span>·</span>
        <span>rendered inline under each field + banner above</span>
      </div>
    </div>
  </div>
);

   ───────────────────────────────────────────── */
const SignupMobile = () => (

      <FormCard width="100%" url="/auth/signup/">
        <div style={{ padding: "22px 22px 26px", display: "flex", flexDirection: "column", gap: 16 }}>
          {/* Header */}
          <div>
            <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.12em", textTransform: "uppercase", color: "var(--muted)", marginBottom: 8 }}>django.contrib.auth</div>
            <h1 style={{ margin: 0, fontFamily: "var(--sans)", fontWeight: 600, fontSize: 23, letterSpacing: "-0.02em", color: "var(--ink)", lineHeight: 1.1 }}>Create an account</h1>

          <form style={{ display: "flex", flexDirection: "column", gap: 12 }}>

            <FormField label="Password" type="password" placeholder="••••••••••••" compact pwToggle />
            <FormField label="Confirm password" type="password" placeholder="••••••••••••" compact pwToggle />
            <button type="button" style={{

            }}>Sign up</button>
          </form>

          <div style={{ paddingTop: 4, borderTop: "1px solid var(--rule)" }}>
            <p style={{ margin: 0, fontSize: 13, color: "var(--muted)", lineHeight: 1.55 }}>
              Already have an account?{" "}
              <a href="#" style={{ color: "var(--ink)", textDecoration: "none", borderBottom: "1px solid var(--rule-2)" }}>Log in</a>
              {" "}— use your email as your username.
            </p>
          </div>
        </div>
      </FormCard>
    </div>
  </div>
);

/* ─────────────────────────────────────────────
   ROOT
   ───────────────────────────────────────────── */
const App = () => (
  <DesignCanvas>
    <DCSection
      id="login"
      title="Page A — Log in"
      subtitle="/auth/login/ · Django LoginView · desktop clean · error state · mobile"
    >
      <DCArtboard id="login-desktop"       label="Desktop — clean"        width={1280}><LoginDesktop /></DCArtboard>
      <DCArtboard id="login-desktop-error" label="Desktop — error state"  width={1280}><LoginDesktopError /></DCArtboard>
      <DCArtboard id="login-mobile"        label="Mobile — 390px"          width={390}><LoginMobile /></DCArtboard>
    </DCSection>

    <DCSection

    >
